name: PR Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 22.5.1
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - run: pnpm install --frozen-lockfile
    - name: Run Tests
      run: pnpm test